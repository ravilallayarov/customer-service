databaseChangeLog:
  - changeSet:
      id: create-customer-table
      author: Ravil Allayarov
      changes:
        - createTable:
            tableName: customers
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: guid
                  type: UUID
                  constraints:
                    nullable: true
              - column:
                  name: name
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: surname
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: country_code_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: contact_details_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: profile_ref
                  type: UUID
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: customers
            baseColumnNames: country_code_id
            referencedTableName: countries
            referencedColumnNames: id
            constraintName: add_country_code_id_foreign_key
        - addForeignKeyConstraint:
            baseTableName: customers
            baseColumnNames: contact_details_id
            referencedTableName: contact_details
            referencedColumnNames: id
            constraintName: add_contact_details_id_foreign_key
