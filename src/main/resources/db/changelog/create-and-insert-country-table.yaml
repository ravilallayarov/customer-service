databaseChangeLog:
  - changeSet:
      id: create-country-table
      author: Ravil Allayarov
      changes:
        - createTable:
            tableName: countries
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: guid
                  type: UUID
                  constraints:
                    nullable: true
              - column:
                  name: country_code
                  type: VARCHAR(3)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false

  - changeSet:
      id: insert-countries
      author: Ravil Allayarov
      changes:
        - insert:
              tableName: countries
              columns:
                - column:
                    name: country_code
                    value: RUS
                - column:
                    name: name
                    value: Russia
                - column:
                    name: created_at
                    valueComputed: NOW()
                - column:
                    name: updated_at
                    valueComputed: NOW()
